name: QA

on:
  push:
  pull_request:

jobs:
  qa:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
        symfony: ['7.4', '8.0', '8.1']
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - run: composer validate --strict --no-check-lock
      - name: Install dependencies for Symfony version
        run: >-
          composer update --prefer-dist --no-progress --no-interaction
          --with="symfony/config:${{ matrix.symfony }}.*"
          --with="symfony/dependency-injection:${{ matrix.symfony }}.*"
          --with="symfony/http-client:${{ matrix.symfony }}.*"
          --with="symfony/http-kernel:${{ matrix.symfony }}.*"
          --with="symfony/framework-bundle:${{ matrix.symfony }}.*"
      - run: composer qa
